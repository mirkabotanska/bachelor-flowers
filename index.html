<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lily – Breathe Back to Light</title>
  </head>
  <body>
    <div id="styles">
      <button data-style="1" title="Points, wireframe, then the flower (key 1)">1 · Build-up</button>
      <button data-style="2" title="Glowing halo (key 2)">2 · Fibres</button>
      <button data-style="3" title="Selection boxes (key 3)">3 · Tracking</button>
      <button data-style="4" title="Roots growing towards the flashlight (key 4)">4 · Roots</button>
      <button data-style="5" title="Build-up with dust from the vertices (key 5)">5 · Build-up + dust</button>
      <button data-style="6" title="Working copy of the roots page (key 6)">6 · Roots v2</button>
      <button data-style="7" title="Particles trace the outlines, then the flower appears (key 7)">7 · Outline particles</button>
      <button data-style="8" title="Soil, water from the light, seeds that sprout (key 8)">8 · Water</button>
    </div>
    <div id="toast"></div>
    <p id="hint">Drag to orbit · scroll to zoom · H hides the panel · 1–8 switch style</p>
    <script type="module" src="/src/main.js"></script>
